<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <link rel="stylesheet" href="css.css">

</head>
<body>
    <!-- Header com logo -->
    <header>
        <div class="header-senai">
            <img src="assets/img/senai.pn" alt="senai-logo">

        </div>
    </header>

        <!-- Cadastro -->
    <main>
        <div class="cadastro">
            <h2>CADASTRO</h2>
        </div>

        <div class="container-form">
            <div class="container-colum">
                <div class="coluna-1">
                    <input type="text" placeholder="Nome">
                    <input type="text" placeholder="Email">
                     <input type="text" placeholder="Data de Nascimento dd/mm/aaaa">
                    <input type="text" placeholder="CPF">
                    <!-- onclick aqui tambem-->
                    <button class="botao-limpar">LIMPAR</button>
                </div>

                <div class="coluna-2">
                    <input type="text" placeholder="Vinculo com Senai">
                    <input type="text" placeholder="Rua">
                    <input type="text" placeholder="Bairro">
                    <select>
                        <option ""></option>
                        <option "RJ">RJ</option >
                            <option "SP">SP</option>
                    </select>

                </div>

                <div class="coluna-3">
                    <input type="text" placeholder="UF/Cidade">
                     <input type="text" placeholder="CEP">
                    <input type="text" placeholder="CEP">
                    <!-- oncliclick aqui-->
                    <button class="botao-adicionar">ADICIONAR</button>

                </div>

            </div>

        </div>

        <div class="container-form">
            <div class="container-colum2">
                <div class="nome"></div>
                <div class="cpf"></div>
                <div class="email"></div>
                <div class="uf-cidade"></div>
                <div>
                    <img src="assets/img/edit.png" alt="editar">
                </div>
                <div>
                    <img src="assets/img/lixo.png" alt="excluir">
                </div>
            </div>
        </div>

        
    </main>


</body>
</html>
