<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <!-- Header com logo -->
    <header>
        <section id="header">
            <div class="header-senai">
                <div class="img-senai">
                    <img src="assets/img/senai.png" alt="senai-logo">

                </div>

            </div>

        </section>

    </header>

        <!-- Cadastro -->
    <main>
        <section id="aba-cadastro">
            <div class="cadastro-text">
                <h2>CADASTRO</h2>
            </div>

            <div class="container-form">
                <div class="container-colum">
                    <div class="coluna-1">
                        <input class="input-class" type="text" id="nome" placeholder="Nome">
                        <input class="input-class" type="date" id="data-nasc" placeholder="dd/mm/aaaa">
                        <input class="input-class" type="text" id="email" placeholder="Email">
                        <input  onchange="buscarCep()" class="input-class" type="text" id="cep" placeholder="CEP">
                        <div class="botao-add-div">
                            <!-- oncliclick aqui-->
                            <button class="botao-add" onclick="Adicionar()">ADICIONAR</button>
                        </div>
                    </div>

                    <div class="coluna-2">
                        <input class="input-class" type="text" id="rua" placeholder="Rua">
                        <input class="input-class" type="text" id="bairro" placeholder="Bairro">
                        <input class="input-class" type="text" id="uf" placeholder="UF">
                        <input class="input-class" type="text" id="cidade" placeholder="Cidade">
                        <input class="input-class" type="number" id="numero-casa" placeholder="N° da Casa">
                        
                        
                    </div>
                    
                    <div class="coluna-3">
                        <input class="input-class" type="text" id="complemento" placeholder="Complemento">
                        <input class="input-class" type="text" id="turma-setor" placeholder="Turma/Setor">
                        <input class="input-class" type="text" id="unidade-senai" placeholder="Unidade Senai">
                        <select id="vinculo" class="select-class">
                            <option value="" disabled selected hidden>Vínculo com o Senai</option>
                            <option value="instrutor">Instrutor</option>
                            <option value="aluno">Aluno</option>
                            <option calue="outro">Outro</option>
                        </select>
                        <div class="botao-clear-div">
                            <!-- onclick aqui tambem-->
                            <button onclick="Limpar()" class="botao-clear">LIMPAR</button>
                        </div>

                    </div>

                </div>

            </div>
        </section>
        <!--sessão regsitro-->
    <section id="aba-listas">
        <div class="container-form">
            <div class="container-lista">
                <button onclick="extender()">Extender</button>
                    <div id="extender1" class="container-extender">
                    </div>             
            </div>
        </div>
    </section>


<script src="site.js"></script>

</body>
</html>
