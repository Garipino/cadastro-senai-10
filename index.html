<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="site.js" defer></script>
    
</head>
<body>
    <!-- Header com logo -->
    <header>
        <section id="header">
            <div class="header-senai">
                <div class="img-senai">
                    <img src="assets/img/senai.png" alt="senai-logo">

                </div>

            </div>

        </section>

    </header>

        <!-- Cadastro -->
    <main>
        <section id="aba-cadastro">
            <div class="cadastro-text">
                <h2>CADASTRO</h2>
            </div>

            <div class="container-form">
                <div class="container-colum">
                    <div id = "coluna1" class="coluna-1">
                        <input class="input-class" type="text" id="nome" placeholder="Nome">
                        <input class="bttn" type="date" id="data-nasc" placeholder="dd/mm/aaaa">
                        <input class="input-class" type="text" id="email" placeholder="Email">
                        <input class="input-class" type="text" id="cpf"placeholder="CPF"> 
                        <input  onchange="buscarCep()" class="input-class" type="text" id="cep" placeholder="CEP">   
        
                    </div>

                    <div class="coluna-2">
                        <input class="input-class" type="text" id="rua" placeholder="Rua">
                        <input class="input-class" type="text" id="bairro" placeholder="Bairro">
                        <input class="input-class" type="text" id="uf" placeholder="UF">
                        <input class="input-class" type="text" id="cidade" placeholder="Cidade">
                        <input class="input-class" type="text" id="numero-casa" placeholder="N° da Casa">
                        
                        
                    </div>
                    
                    <div class="coluna-3">
                        <input class="input-class" type="text" id="complemento" placeholder="Complemento">
                        <input class="input-class" type="text" id="turma-setor" placeholder="Turma/Setor">
                        <input class="input-class" type="text" id="unidade-senai" placeholder="Unidade Senai">
                        <select id="vinculo" class="select-class">
                            <option value="" disabled selected hidden>Vínculo com o Senai</option>
                            <option value="instrutor">Instrutor</option>
                            <option value="aluno">Aluno</option>
                            <option value="outro">Outro</option>
                        </select>
                        

                    </div>

                </div>
                
                <div class="row-1">
                        <div class="botao-add-div">
                            <!-- oncliclick aqui-->
                            <button class="botao-add" onclick="Adicionar()">ADICIONAR</button>
                        </div>
                        <div class="botao-clear-div">
                            <!-- onclick aqui tambem-->
                            <button onclick="Limpar()" class="botao-clear">LIMPAR</button>
                        </div>

                    </div>

            </div>
        </section>
        <!--sessão regsitro-->
    <section id="aba-listas">

        <!--pop up delete-->

        <dialog id="popupdelete">
            <h3>Confirmar ação</h3>
            <p>Tem certeza que deseja continuar?</p>
        
            <div class="botoes-popup">
                <button id="btnConfirmar">Confirmar</button>
                <button id="btnCancelar" onclick="cancelar()">cancelar</button>
            </div>
            
        </dialog>

        <dialog id="popupedit">
            
            <div class="container-edit">
                <h3>EDITAR</h3>
                <input class="input-edit" id="name" type="text" placeholder="Nome">
                <input class="input-edit" id="cpf-edit" type="text" placeholder="CPF">
                <input class="input-edit" id="data-edit" type="date">
                <input class="input-edit" id="email-edit" type="text" placeholder="Email">
                <input class="input-edit" id="cep-edit" type="text" placeholder="CEP">
                <input class="input-edit" id="rua-edit" type="text" placeholder="Rua">
                <input class="input-edit" id="bairro-edit" type="text" placeholder="Bairro">
                <input class="input-edit" id="UF-edit" type="text" placeholder="UF">
                <input class="input-edit" id="cidade-edit" type="text" placeholder="Cidade">
                <input class="input-edit" id="Num-casa" type="text" placeholder="N° da Casa">
                <input class="input-edit" id="complemento-edit" type="text" placeholder="Complemento">
                <input class="input-edit" id="turma-setor-edit" type="text" placeholder="Turma/Setor">
                <input class="input-edit" id="unidade-edit" type="text" placeholder="Unidade Senai">
                <select id="vinculo-edit" class="select-class">
                    <option value="" disabled selected hidden>Vínculo com o Senai</option>
                    <option value="instrutor">Instrutor</option>
                    <option value="aluno">Aluno</option>
                    <option value="outro">Outro</option>
                </select>
                <button class="confirmar" id="ConfirmarEdit" onclick="ConfirmarEdit()">Confirmar</button>
                <button class="cancelar" id="CancelarEdit" onclick="cancelarEdit()">cancelar</button>
            </div>

        </dialog>
        <!---->
        <div class="container-form">
            <button id="estender" onclick="extender()">
                <i class="fa-solid fa-angle-down"></i>
                
            </button>
            <div class="container-lista">
                <div id="extender1" class="container-extender">
                </div>             
            </div>
        </div>
    </section>
    </main>


</body>
<script src="site.js" defer></script>
</html>
